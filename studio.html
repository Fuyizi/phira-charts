<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创作中心</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/wiki.css">
<script>/* 在样式生效前先定好主题，避免深色模式下刷新闪白 */
(function(){try{var t=localStorage.getItem("pez-theme");
if(!t||t==="auto"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}
document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>

<header id="header-mount" class="site-header"></header>

<div class="layout no-rail">
  <aside id="sidebar-mount" class="sidebar"></aside>

  <main class="content">
    <h1 class="page-title">创作中心</h1>
    <p class="page-sub">用访问码登录，管理你自己上传的谱面</p>

    <div id="login-mount"></div>
    <div id="status-mount"></div>
    <div id="list-mount"></div>
    <div id="edit-mount"></div>
  </main>
</div>

<footer id="footer-mount" class="site-footer"></footer>

<script>
/* 数据文件每次都拿最新的：
   GitHub Pages 会给 data/charts.js 设 Cache-Control: max-age=600（10 分钟），
   而「检测到更新就刷新首页」要靠它 —— 加时间戳才能绕开这份缓存。
   ⚠️ 时间戳必须**每次加载都不一样**：原来用的是「每分钟一个版本号」，
   结果自动刷新那一刻若还没跨分钟，reload 会命中浏览器缓存（max-age=600），
   刷了还是旧内容、而且之后不会再重试 —— 表现就是「传完谱刷新没生效」。
   代价是每次访问都要重新下这个小文件（约 11KB），可以接受。
   必须同步执行（后面的脚本都依赖 window.CHARTS），所以用 document.write。
   file:// 下不能带查询参数（会找不到文件），所以按协议判断。 */
(function () {
  var q = location.protocol === "file:" ? "" : "?t=" + Date.now();
  document.write('<script src="data/charts.js' + q + '"><\/script>');
})();
</script>
<script src="assets/js/common.js"></script>
<!-- 重传 .pez 要解包 + 读 info.txt + 统计音符/判定线，复用上传页那个解析器。
     importer.js 在找不到 #dropzone 时会自动「只当库用」、不碰页面（见它的 boot()）。 -->
<script src="vendor/jszip.min.js"></script>
<script src="assets/js/importer.js"></script>
<script src="assets/js/studio.js"></script>
</body>
</html>
